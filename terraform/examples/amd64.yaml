apiVersion: apps/v1
kind: Deployment
metadata:
  name: amd64-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: amd64-test
  template:
    metadata:
      labels:
        app: amd64-test
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
        karpenter.sh/nodepool: amd64
      containers:
        - name: nginx
          image: public.ecr.aws/docker/library/nginx:stable-alpine
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
