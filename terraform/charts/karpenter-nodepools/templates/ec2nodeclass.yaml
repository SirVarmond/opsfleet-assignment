apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: opsfleet
spec:
  role: {{ .Values.nodeRole | quote }}

  amiSelectorTerms:
    - alias: al2023@latest

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ .Values.clusterName | quote }}

  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 20Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true

  tags:
    Project: opsfleet-assignment
    Environment: poc
